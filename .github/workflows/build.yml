name: build

# builds the Xnounce plugin for Linux, Windows, and macOS, runs unit tests, and package the release
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04 # oldest supported glibc for the release binary
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DXN_STATIC_RUNTIME=ON -DXN_VERSION_SUFFIX="$(bash tools/version_suffix.sh)"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v7
        with: { name: lin_x64, path: build/Xnounce/lin_x64/Xnounce.xpl }

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DXN_VERSION_SUFFIX="$(bash tools/version_suffix.sh)"
        shell: bash
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          {
            name: win_x64,
            path: build/Xnounce/win_x64/Release/Xnounce.xpl,
          }

  macos:
    runs-on: macos-15 # macos-14 images retire 2026-11-02
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DXN_VERSION_SUFFIX="$(bash tools/version_suffix.sh)"
      - run: cmake --build build
      - run: lipo build/Xnounce/mac_x64/Xnounce.xpl -verify_arch x86_64 arm64 # one universal binary
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v7
        with: { name: mac_x64, path: build/Xnounce/mac_x64/Xnounce.xpl }

  # The tests again under AddressSanitizer and UndefinedBehaviorSanitizer.
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev ninja-build
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  # Every source file is formatted with the pinned clang-format.
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pipx install clang-format==23.1.4
      - run: tools/format.sh --check

  # The API reference builds from the source comments. Download it from the run's artifacts.
  apidocs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - run: mkdir -p build && doxygen Doxyfile
      - uses: actions/upload-artifact@v7
        with: { name: apidocs, path: build/apidocs/html }

  package:
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { pattern: "*_x64", path: dist-in } # dist-in/{lin,win,mac}_x64/Xnounce.xpl
      - env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: tools/package.sh dist-in dist "$TAG"
      - uses: actions/upload-artifact@v7
        with: { name: Xnounce, path: dist/stage }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/release-notes.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: release, path: release }
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run replaces this tag's draft. A published release is never touched.
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published. Bump the version for a new release."
              exit 1
            fi
            gh release delete "$TAG" --yes    # deletes the draft only; the git tag stays
          fi
          # A release candidate (vX.Y.Z-rc.N) is published as a prerelease.
          pre=""
          case "$TAG" in *-rc.*) pre="--prerelease" ;; esac
          gh release create "$TAG" --draft $pre --verify-tag --title "Xnounce ${TAG#v}" \
            --notes-file release/release-notes.md release/*.zip release/*.zip.sha256

  # The API reference goes to GitHub Pages on a final release tag (not a release candidate). One-time setup:
  # Settings > Pages > Source: GitHub Actions.
  pages:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc.')
    needs: [apidocs, release]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with: { name: apidocs, path: apidocs }
      - uses: actions/upload-pages-artifact@v4
        with: { path: apidocs }
      - id: deploy
        uses: actions/deploy-pages@v4

  # docs/wiki/ is copied to the repository's wiki on a final release tag. One-time setup: create any page in the
  # wiki by hand, so that the wiki repository exists.
  wiki:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc.')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d docs/wiki ] || { echo "no docs/wiki: nothing to publish"; exit 0; }
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Wiki for ${GITHUB_REF_NAME}"; git push; }
