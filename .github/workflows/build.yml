name: build

# builds the Xnounce plugin for Linux, Windows, and macOS, runs unit tests, and package the release
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04 # oldest supported glibc for the release binary
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DXN_STATIC_RUNTIME=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v7
        with: { name: lin_x64, path: build/Xnounce/lin_x64/Xnounce.xpl }

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          {
            name: win_x64,
            path: build/Xnounce/win_x64/Release/Xnounce.xpl,
          }

  macos:
    runs-on: macos-15 # macos-14 images retire 2026-11-02
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: lipo build/Xnounce/mac_x64/Xnounce.xpl -verify_arch x86_64 arm64 # one universal binary
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v7
        with: { name: mac_x64, path: build/Xnounce/mac_x64/Xnounce.xpl }

  # The tests again under AddressSanitizer and UndefinedBehaviorSanitizer.
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev ninja-build
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  # Every source file is formatted with the pinned clang-format.
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pipx install clang-format==23.1.4
      - run: tools/format.sh --check

  # The API reference builds from the source comments. Download it from the run's artifacts.
  apidocs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - run: doxygen Doxyfile
      - uses: actions/upload-artifact@v7
        with: { name: apidocs, path: build/apidocs/html }

  package:
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { pattern: "*_x64", path: dist-in } # dist-in/{lin,win,mac}_x64/Xnounce.xpl
      - env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: tools/package.sh dist-in dist "$TAG"
      - uses: actions/upload-artifact@v7
        with: { name: Xnounce, path: dist/stage }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/release-notes.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: release, path: release }
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run replaces this tag's draft. A published release is never touched.
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published. Bump the version for a new release."
              exit 1
            fi
            gh release delete "$TAG" --yes    # deletes the draft only; the git tag stays
          fi
          gh release create "$TAG" --draft --verify-tag --title "Xnounce ${TAG#v}" \
            --notes-file release/release-notes.md release/*.zip release/*.zip.sha256
